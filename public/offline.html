<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão — Rotas</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #f5f7fa; color: #0f1b33;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .caixa {
    max-width: 340px; text-align: center; background: #fff;
    border: 1px solid #e2e7ef; border-radius: 14px; padding: 28px 22px;
  }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 19px; margin: 18px 0 6px; color: #12295c; }
  p { font-size: 14px; line-height: 1.5; color: #5c6980; margin: 0; }
  button {
    margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 12px;
    background: #ffdd00; color: #0f1b33; font-size: 15px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="caixa">
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>O app precisa de internet para salvar a conferência. Assim que o sinal voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
