<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotas — MVP</title>
<link rel="icon" href="./logo-rotas.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #F5F7FA; color: #0F1B33;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 440px; }
  .logo { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; display: block; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
  p.sub { margin: 0 0 28px; color: #5B6B85; font-size: 15px; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: #fff;
    border: 1px solid #E2E8F2; border-radius: 14px; padding: 18px 20px;
    margin-bottom: 12px; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: #12295C; transform: translateY(-1px); }
  a.card strong { display: block; font-size: 16px; margin-bottom: 4px; }
  a.card span { font-size: 13.5px; color: #5B6B85; }
  footer { margin-top: 24px; font-size: 12.5px; color: #94A0B4; }
</style>
</head>
<body>
<main>
  <img class="logo" src="./logo-rotas.png" alt="">
  <h1>Rotas</h1>
  <p class="sub">MVP mobile-first — protótipos navegáveis</p>

  <a class="card" href="./Rotas%20App.dc.html">
    <strong>Rotas App</strong>
    <span>App do entregador: login, lista de rotas e execução de paradas</span>
  </a>

  <a class="card" href="./Conferencia%20de%20Rotas.dc.html">
    <strong>Conferência de Rotas</strong>
    <span>Painel de conferência — tema escuro</span>
  </a>

  <footer>Protótipo estático · sem backend</footer>
</main>
</body>
</html>
